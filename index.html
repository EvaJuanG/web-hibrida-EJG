<!DOCTYPE html>
<html>
<head>
<title>Pares</title>
</head>
<body>
<h2>Mi JavaScript</h2>
<button id="boton">Escribe una palabra</button>
<p id="letras"></p>

<script>
function paraula(){
let pedirPalabra = prompt("Escribe una palabra: ");
let recuento = 0;
for (let i=0; i< pedirPalabra.length; i++){
	recuento++;
    }
    document.write("La palabra tiene : " + recuento + " letras."); 
    document.getElementById("letras").innerHTML
    }
    document.getElementById("boton").addEventListener("click", paraula);

</script>

</body>
</html>
